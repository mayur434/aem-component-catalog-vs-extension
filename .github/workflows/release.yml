name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run compile
      - run: npm run package:vsix
      - run: npm run sbom
      - name: Create checksums
        run: sha256sum *.vsix sbom.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.vsix'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.vsix sbom.cdx.json SHA256SUMS --generate-notes --verify-tag
